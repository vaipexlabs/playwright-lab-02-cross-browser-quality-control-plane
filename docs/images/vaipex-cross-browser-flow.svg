<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vaipex cross-browser quality control plane flow</title>
  <desc id="desc">Compatibility intent becomes isolated browser and device execution, comparable evidence, and one governed quality decision.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#152252" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#175ec8"/></marker>
    <style>.ink{fill:#07164f}.muted{fill:#53617f}.eyebrow{font:700 14px Arial,sans-serif;letter-spacing:1.3px}.title{font:800 34px Arial,sans-serif}.cardtitle{font:700 20px Arial,sans-serif}.body{font:16px Arial,sans-serif}.small{font:14px Arial,sans-serif}.line{stroke:#175ec8;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d42e8;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/><circle cx="1450" cy="40" r="235" fill="#f4efff" opacity=".78"/><circle cx="80" cy="850" r="250" fill="#edf6ff" opacity=".9"/>
  <g transform="translate(583 28)"><path d="M0 0h36l24 43-17 29z" fill="#2877ff"/><path d="M72 0h36L66 72H43z" fill="#6d42e8"/><text x="135" y="55" class="ink" style="font:800 38px Arial,sans-serif;letter-spacing:4px">VAIPEX LABS</text></g>
  <text x="800" y="145" text-anchor="middle" class="title ink">CROSS-BROWSER QUALITY CONTROL PLANE</text>
  <text x="800" y="181" text-anchor="middle" class="body muted">Turn compatibility expectations into comparable evidence and one delivery decision</text>
  <path d="M310 425H355M610 425H655M910 425H955M1210 425H1255" class="line"/>
  <g transform="translate(55 270)" filter="url(#shadow)"><rect width="255" height="310" rx="24" fill="#f7f9ff" stroke="#2877ff" stroke-width="2"/><circle cx="127" cy="66" r="38" fill="#eaf3ff" stroke="#2877ff" stroke-width="3"/><path d="M106 49h42v34h-42zM114 59h26M114 70h18" fill="none" stroke="#2877ff" stroke-width="4"/><text x="127" y="125" text-anchor="middle" class="eyebrow ink">DECLARE</text><text x="127" y="165" text-anchor="middle" class="cardtitle ink">Define Coverage</text><text x="127" y="210" text-anchor="middle" class="body muted">Browser engines</text><text x="127" y="238" text-anchor="middle" class="body muted">Device profiles</text><text x="127" y="266" text-anchor="middle" class="body muted">Execution stage</text></g>
  <g transform="translate(355 270)" filter="url(#shadow)"><rect width="255" height="310" rx="24" fill="#fff" stroke="#2877ff" stroke-width="2"/><circle cx="127" cy="66" r="38" fill="#eaf3ff" stroke="#2877ff" stroke-width="3"/><path d="M103 49h48v34h-48zM111 57h32v18h-32z" fill="none" stroke="#2877ff" stroke-width="4"/><text x="127" y="125" text-anchor="middle" class="eyebrow ink">EXPAND</text><text x="127" y="165" text-anchor="middle" class="cardtitle ink">Build the Matrix</text><text x="127" y="210" text-anchor="middle" class="body muted">Chromium and Firefox</text><text x="127" y="238" text-anchor="middle" class="body muted">WebKit and mobile</text><text x="127" y="266" text-anchor="middle" class="body muted">Risk-based profiles</text></g>
  <g transform="translate(655 270)" filter="url(#shadow)"><rect width="255" height="310" rx="24" fill="#f8f5ff" stroke="#6d42e8" stroke-width="2"/><circle cx="127" cy="66" r="38" fill="#f1ecff" stroke="#6d42e8" stroke-width="3"/><path d="M104 47h46v35h-46zM113 91h28M122 82v9" fill="none" stroke="#6d42e8" stroke-width="4"/><circle cx="137" cy="64" r="6" fill="#6d42e8"/><text x="127" y="125" text-anchor="middle" class="eyebrow ink">EXERCISE</text><text x="127" y="165" text-anchor="middle" class="cardtitle ink">Run Journeys</text><text x="127" y="210" text-anchor="middle" class="body muted">Shared test intent</text><text x="127" y="238" text-anchor="middle" class="body muted">Isolated contexts</text><text x="127" y="266" text-anchor="middle" class="body muted">Parallel execution</text></g>
  <g transform="translate(955 270)" filter="url(#shadow)"><rect width="255" height="310" rx="24" fill="#f8f5ff" stroke="#6d42e8" stroke-width="2"/><circle cx="127" cy="66" r="38" fill="#f1ecff" stroke="#6d42e8" stroke-width="3"/><path d="M106 83V54h10v29M124 83V43h10v40M142 83V63h10v20" fill="none" stroke="#6d42e8" stroke-width="5"/><text x="127" y="125" text-anchor="middle" class="eyebrow ink">COMPARE</text><text x="127" y="165" text-anchor="middle" class="cardtitle ink">Merge Evidence</text><text x="127" y="210" text-anchor="middle" class="body muted">Results by profile</text><text x="127" y="238" text-anchor="middle" class="body muted">Traces and media</text><text x="127" y="266" text-anchor="middle" class="body muted">Failure patterns</text></g>
  <g transform="translate(1255 270)" filter="url(#shadow)"><rect width="290" height="310" rx="24" fill="#f4fbf8" stroke="#16a085" stroke-width="2"/><circle cx="145" cy="66" r="38" fill="#eaf8f4" stroke="#16a085" stroke-width="3"/><path d="M124 68l14 14 30-34" fill="none" stroke="#16a085" stroke-width="6"/><text x="145" y="125" text-anchor="middle" class="eyebrow ink">DECIDE</text><text x="145" y="165" text-anchor="middle" class="cardtitle ink">Enforce the Gate</text><text x="145" y="210" text-anchor="middle" class="body muted">Required profiles pass</text><text x="145" y="238" text-anchor="middle" class="body muted">Evidence published</text><text x="145" y="266" text-anchor="middle" class="body muted">Release signal</text></g>
  <path d="M1400 580V700Q1400 735 1365 735H245Q190 735 190 680V580" class="dash"/><rect x="550" y="704" width="500" height="58" rx="28" fill="#fff" stroke="#d8cbff" stroke-width="2"/><text x="800" y="740" text-anchor="middle" class="cardtitle" fill="#5b35d5">COMPATIBILITY FEEDBACK</text>
  <rect x="70" y="810" width="700" height="58" rx="18" fill="#edf6ff" stroke="#96c5ff"/><text x="98" y="845" class="small ink"><tspan font-weight="700">DEVELOPERS</tspan><tspan> — receive fast representative feedback before submitting change</tspan></text><rect x="830" y="810" width="700" height="58" rx="18" fill="#f7f3ff" stroke="#cbb7ff"/><text x="858" y="845" class="small ink"><tspan font-weight="700">DELIVERY PLATFORM</tspan><tspan> — enforce intentional compatibility coverage at every stage</tspan></text>
</svg>
